<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog Tech</title>

    <style>
        body {
            background-color: #121826;
            color: #f1f5f9;
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        h1 {
            color: #60a5fa;
        }

        article {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 15px;
        }

        h2 {
            color: #a78bfa;
        }

        p {
            color: #cbd5e1;
        }

        article img {
            width: 100%;
            max-width: 700px;
            height: auto;
            display: block;
            margin: 20px auto;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>

    <main>
        <article>
            <h2>Meu primeiro post</h2>
            <p>Por: Davi Ferreira Verissimo</p>

            <img 
                src="https://images.unsplash.com/photo-1518770660439-4636190af475"
                alt="Computador e componentes tecnológicos representando programação e tecnologia"
            >

            <p>Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.</p>
        </article>
    </main>

</body>
</html>
