<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Blog Tech</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Meu blog tech</h1>
        <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>

    <main>
        <article>
            <h2>Meu primeiro post</h2>

            <p><strong>Por: Davi Ferreira Verissimo</strong></p>

            <img 
                src="https://images.unsplash.com/photo-1518770660439-4636190af475"
                alt="Computador e componentes tecnológicos representando programação e tecnologia"
            >

            <p>
                Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de programação e curiosidades da área de tecnologia.
            </p>

            <!-- O botão permite que o leitor registre uma reação ao post -->
            <button id="botaoReacao">
                ❤️ Reagir

                <!-- O span mostra a quantidade de reações -->
                <span id="contador">0</span>
            </button>

        </article>
    </main>

    <script src="script.js"></script>

</body>
</html>
